<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#020604">
  <title>// restricted</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>
  <div class="crt" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- ============ LOCK SCREEN ============ -->
  <section id="lock" class="screen">
    <div class="term" id="term">
      <div class="term-bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="term-title">ssh root@vault — 80×24</span>
        <span class="term-clock" id="clock">--:--:--</span>
      </div>
      <div class="term-body">
        <h1 class="lock-head glitch" data-text="RESTRICTED">RESTRICTED</h1>
        <p class="lock-sub">private archive · authorised personnel only</p>
        <div class="bootlog" id="bootlog" aria-live="polite"></div>

        <form id="authForm" class="auth" hidden autocomplete="off">
          <label class="prompt-line" for="pass"><span class="ps1">root@vault</span>:<span class="ps2">~</span>$ ./authenticate --passcode</label>
          <div class="input-wrap">
            <span class="gt">&gt;</span>
            <input id="pass" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="enter passcode" aria-label="Passcode">
            <button type="button" class="peek" id="peek" aria-label="Show passcode" aria-pressed="false">show</button>
          </div>
          <button type="submit" class="btn wide" id="authBtn">▸ authenticate</button>
          <div class="progress" id="progress" hidden>
            <div class="track"><div class="bar"></div></div>
            <span class="hex"></span>
          </div>
          <p class="status" id="authStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
    <p class="lock-foot">aes-256-gcm · pbkdf2-sha256 · client-side only</p>
  </section>

  <!-- ============ VAULT ============ -->
  <section id="vault" class="screen" hidden>
    <header class="topbar">
      <div class="bar-in">
        <div class="brand"><span class="led"></span><span id="brandTitle">vault</span></div>
        <nav class="tabs" role="tablist" aria-label="Sections">
          <button role="tab" data-tab="home"><i>00</i>home</button>
          <button role="tab" data-tab="memories"><i>01</i>memories</button>
          <button role="tab" data-tab="gallery"><i>02</i>gallery</button>
          <button role="tab" data-tab="notes"><i>03</i>notes</button>
          <button role="tab" data-tab="dates"><i>04</i>dates</button>
        </nav>
        <button class="btn sm danger" id="lockBtn" title="Lock now (L)">⏻ lock</button>
      </div>
    </header>

    <main class="wrap">
      <section class="panel" id="tab-home" role="tabpanel"></section>
      <section class="panel" id="tab-memories" role="tabpanel" hidden></section>
      <section class="panel" id="tab-gallery" role="tabpanel" hidden></section>
      <section class="panel" id="tab-notes" role="tabpanel" hidden></section>
      <section class="panel" id="tab-dates" role="tabpanel" hidden></section>
    </main>

    <footer class="statusbar" id="statusbar"></footer>
  </section>

  <!-- ============ LIGHTBOX ============ -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lb-top"><span id="lbIdx"></span><button class="btn sm" id="lbClose">✕ close</button></div>
    <div class="lb-stage" id="lbStage">
      <button class="lb-nav" id="lbPrev" aria-label="Previous photo">‹</button>
      <img id="lbImg" alt="">
      <button class="lb-nav" id="lbNext" aria-label="Next photo">›</button>
    </div>
    <div class="lb-cap"><span id="lbCap"></span><time id="lbDate"></time></div>
  </div>

  <script src="vault.js"></script>
  <script src="crypto.js"></script>
  <script src="app.js"></script>
</body>
</html>
