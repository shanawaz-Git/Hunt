<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<title>ragave</title>
<style>
  /* ============ TOKENS ============ */
  :root{
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sent-grad: linear-gradient(135deg,#4E5BF2 0%,#8B37C4 55%,#D9308A 100%);
    --blue:#0095F6;
    --ring: linear-gradient(45deg,#FBAD50,#E0316A,#B92DB1);
    --r-bubble:20px;
  }
  html[data-theme="dark"]{
    --bg:#000; --panel:#000; --line:#262626; --line-soft:#1c1c1c;
    --txt:#F5F5F5; --txt-2:#A8A8A8; --txt-3:#737373;
    --rx:#262626; --rx-txt:#F5F5F5; --hover:#121212; --field:#262626;
  }
  html[data-theme="light"]{
    --bg:#fff; --panel:#fff; --line:#DBDBDB; --line-soft:#EFEFEF;
    --txt:#000; --txt-2:#737373; --txt-3:#8E8E8E;
    --rx:#EFEFEF; --rx-txt:#000; --hover:#FAFAFA; --field:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); background:var(--bg); color:var(--txt);
    font-size:15px; overflow:hidden;
  }
  button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  svg{display:block}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

  /* ============ SHELL ============ */
  .app{height:100dvh;display:grid;grid-template-columns:1fr;}
  @media(min-width:1000px){
    .app{grid-template-columns:76px 350px 1fr; border-right:0}
  }

  /* ---- left icon rail (desktop only, decorative) ---- */
  .rail{display:none;border-right:1px solid var(--line);padding:12px 0 20px;flex-direction:column;align-items:center;gap:4px}
  @media(min-width:1000px){.rail{display:flex}}
  .rail .mark{font:600 22px/1 var(--font);letter-spacing:-.5px;margin:14px 0 26px;transform:rotate(-4deg)}
  .rail button{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;color:var(--txt-2)}
  .rail button:hover{background:var(--hover);color:var(--txt)}
  .rail button.on{color:var(--txt)}
  .rail .spacer{flex:1}

  /* ---- conversation list (desktop only) ---- */
  .list{display:none;border-right:1px solid var(--line);flex-direction:column;min-height:0}
  @media(min-width:1000px){.list{display:flex}}
  .list-top{padding:22px 24px 8px;display:flex;align-items:center;justify-content:space-between}
  .list-top h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.2px}
  .tabs{display:flex;gap:22px;padding:12px 24px 0;font-size:14px;font-weight:600}
  .tabs span{color:var(--txt-3);padding-bottom:12px}
  .tabs span.on{color:var(--txt);border-bottom:1px solid var(--txt)}
  .list-scroll{overflow:auto;padding:8px 0}
  .row{display:flex;gap:12px;align-items:center;padding:8px 24px;width:100%;text-align:left}
  .row:hover{background:var(--hover)}
  .row.on{background:var(--line-soft)}
  .row .meta{min-width:0;flex:1}
  .row .nm{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .sub{font-size:14px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}

  /* ---- avatars ---- */
  .av{border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;
      background:var(--rx);font-weight:600;color:var(--rx-txt);object-fit:cover}
  .av.s{width:24px;height:24px;font-size:11px}
  .av.m{width:32px;height:32px;font-size:13px}
  .av.l{width:56px;height:56px;font-size:20px}
  .av.xl{width:96px;height:96px;font-size:34px}
  .ring{padding:2px;border-radius:50%;background:var(--ring);flex:none;display:inline-flex}
  .ring>.av{border:2px solid var(--bg)}
  .live{position:relative}
  .live::after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;
    background:#2ECC71;border:3px solid var(--bg)}

  /* ============ THREAD ============ */
  .thread{display:flex;flex-direction:column;min-height:0;height:100dvh;background:var(--panel)}
  .head{
    display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);
    flex:none;padding-top:calc(8px + env(safe-area-inset-top));
  }
  @media(min-width:1000px){.head{padding:14px 20px}}
  .back{display:grid;place-items:center;width:32px;height:40px;margin-left:-4px}
  @media(min-width:1000px){.back{display:none}}
  .who{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
  .who .nm{font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .st{font-size:12px;color:var(--txt-3);margin-top:1px}
  .acts{display:flex;align-items:center;gap:20px;color:var(--txt)}
  .acts button:active{opacity:.5}

  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 12px 8px;display:flex;flex-direction:column;gap:2px}
  @media(min-width:1000px){.scroll{padding:20px 20px 8px}}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

  /* profile intro at top of thread */
  .intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 20px 34px}
  .intro .n{font-size:20px;font-weight:600;margin-top:12px}
  .intro .h{font-size:14px;color:var(--txt-3)}
  .intro .btn{margin-top:14px;background:var(--rx);color:var(--rx-txt);font-size:14px;font-weight:600;
    padding:7px 16px;border-radius:8px}

  .day{align-self:center;font-size:12px;color:var(--txt-3);margin:14px 0 10px}

  .grp{display:flex;align-items:flex-end;gap:8px;max-width:100%;animation:in .22s ease-out}
  .grp.me{flex-direction:row-reverse}
  .grp .slot{width:28px;flex:none}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .bub{
    position:relative;max-width:min(72%,540px);padding:9px 13px;border-radius:var(--r-bubble);
    font-size:15px;line-height:1.35;word-wrap:break-word;white-space:pre-wrap;
  }
  .grp.you .bub{background:var(--rx);color:var(--rx-txt);border-bottom-left-radius:var(--r-bubble)}
  .grp.me .bub{background:var(--sent-grad);color:#fff}
  .grp.you.cont .bub{border-top-left-radius:6px}
  .grp.you.nxt .bub{border-bottom-left-radius:6px}
  .grp.me.cont .bub{border-top-right-radius:6px}
  .grp.me.nxt .bub{border-bottom-right-radius:6px}
  .bub.emoji{background:none!important;font-size:44px;padding:2px 6px;line-height:1.1}
  .bub .rx{position:absolute;bottom:-11px;font-size:14px;background:var(--bg);border-radius:12px;
    padding:1px 3px;line-height:1;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
  .grp.you .bub .rx{right:-6px} .grp.me .bub .rx{left:-6px}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .stamp{font-size:11px;color:var(--txt-3);align-self:flex-end;padding:2px 4px 8px}
  .fail{font-size:11px;color:#ED4956;align-self:flex-end;padding:2px 4px 8px}
  .fail button{text-decoration:underline;font-size:11px;color:#ED4956}

  .typing .bub{padding:13px 15px;display:flex;gap:4px;align-items:center}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--txt-3);display:block;animation:bo 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.16s} .typing i:nth-child(3){animation-delay:.32s}
  @keyframes bo{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}

  /* ============ COMPOSER ============ */
  .bar{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:10px}
  @media(min-width:1000px){.bar{padding:8px 20px 20px}}
  .cam{width:32px;height:32px;border-radius:50%;background:var(--sent-grad);display:grid;place-items:center;color:#fff;flex:none;margin-bottom:3px}
  .pill{flex:1;display:flex;align-items:flex-end;gap:10px;border:1px solid var(--line);border-radius:22px;padding:6px 12px;background:var(--field);min-width:0}
  .pill textarea{
    flex:1;border:0;background:none;resize:none;color:var(--txt);font:15px/1.35 var(--font);
    max-height:96px;padding:4px 0;outline:none;min-width:0;
  }
  .pill textarea::placeholder{color:var(--txt-3)}
  .tools{display:flex;align-items:center;gap:14px;color:var(--txt);flex:none;padding-bottom:3px}
  .send{color:var(--blue);font-weight:600;font-size:14px;padding-bottom:5px;flex:none;display:none}
  .typing-mode .tools{display:none}
  .typing-mode .send{display:block}
  .typing-mode .cam{display:none}

  .hide{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app">

  <!-- ============ LEFT RAIL (decorative) ============ -->
  <nav class="rail" aria-hidden="true">
    <div class="mark">Chat</div>
    <button title="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9.5 21v-6h5v6"/></svg></button>
    <button title="Search"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button title="Explore"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg></button>
    <button class="on" title="Messages"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5c5.4 0 9.5 4 9.5 9.3S17.4 21 12 21a10 10 0 0 1-3-.5L4 22l1.2-3.6A9.1 9.1 0 0 1 2.5 11.8C2.5 6.5 6.6 2.5 12 2.5Z"/><path d="m7.5 13.5 3-4 3 2.5 3-4"/></svg></button>
    <button title="Notifications"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c4.5-3.2 8-6.2 8-10a4.4 4.4 0 0 0-8-2.6A4.4 4.4 0 0 0 4 11c0 3.8 3.5 6.8 8 10Z"/></svg></button>
    <div class="spacer"></div>
    <button id="themeBtn" title="Switch theme" aria-hidden="false">
      <svg id="themeIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </nav>

  <!-- ============ CHAT LIST (desktop) ============ -->
  <aside class="list">
    <div class="list-top">
      <h1 id="meName">shanawaz</h1>
      <button title="New message"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12.5 14.5l-4 1 1-4z"/></svg></button>
    </div>
    <div class="tabs"><span class="on">Messages</span><span>Requests</span></div>
    <div class="list-scroll">
      <button class="row on">
        <span class="ring"><span class="av l" id="listAv"></span></span>
        <span class="meta">
          <span class="nm" id="listName">ragave</span>
          <span class="sub" id="listSub">Active now</span>
        </span>
        <span class="dot"></span>
      </button>
    </div>
  </aside>

  <!-- ============ THREAD ============ -->
  <main class="thread">
    <header class="head">
      <button class="back" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5 8 12l7 7"/></svg></button>
      <div class="who">
        <span class="live"><span class="av m" id="headAv"></span></span>
        <span style="min-width:0">
          <div class="nm" id="headName">ragave</div>
          <div class="st">Active now</div>
        </span>
      </div>
      <div class="acts">
        <button aria-label="Audio call"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 3.5 9 8l-2 2a12 12 0 0 0 5 5l2-2 4.5 2.5-.7 3.2a1.6 1.6 0 0 1-1.8 1.2C8.6 19 5 15.4 3.1 8a1.6 1.6 0 0 1 1.2-1.8z"/></svg></button>
        <button aria-label="Video call"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="14" height="12" rx="3"/><path d="m16 11 6-3.5v9L16 13z"/></svg></button>
        <button aria-label="Conversation info" id="infoBtn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".9" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <div class="intro">
        <span class="ring"><span class="av xl" id="introAv"></span></span>
        <div class="n" id="introName">ragave</div>
        <div class="h"><span id="introHandle">@ragave</span> · Instagram</div>
        <button class="btn">View profile</button>
      </div>
      <div class="day" id="dayLabel">Today</div>
    </div>

    <div class="bar" id="bar">
      <button class="cam" aria-label="Camera"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.5-2.5h7L17 7h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3.6"/></svg></button>
      <div class="pill">
        <textarea id="input" rows="1" placeholder="Message..." autocomplete="off"></textarea>
        <div class="tools">
          <button aria-label="Voice message"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg></button>
          <button aria-label="Send photo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg></button>
          <button aria-label="Send sticker"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13.5 3H6a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h6l9-9V6a3 3 0 0 0-3-3z"/><path d="M21 12h-6a3 3 0 0 0-3 3v6"/></svg></button>
          <button aria-label="Send a heart" id="heartBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5c4.6-3.3 8.2-6.4 8.2-10.3A4.5 4.5 0 0 0 12 7.6a4.5 4.5 0 0 0-8.2 2.6c0 3.9 3.6 7 8.2 10.3Z"/></svg></button>
        </div>
        <button class="send" id="sendBtn">Send</button>
      </div>
    </div>
  </main>
</div>

<script>
/* ==================================================================
   1) CONFIG — edit this block only
   ================================================================== */
const CONFIG = {
  BOT_NAME:   "venkatesh_ravichandran",
  BOT_HANDLE: "@venkatesh_ravichandran",
  BOT_AVATAR: "",              // paste an image URL here, else initials are used
  ME_NAME:    "piscesxo",
  ME_AVATAR:  "",

  // Personality. Rewrite freely — this is what makes the bot feel like her.
  PERSONA: `You are Ragave, texting on Instagram with Shanawaz — someone you're very close to.
Rules for how you text:
- Text like a real person on IG DMs. Lowercase mostly, short, casual, no formal grammar.
- Keep replies SHORT: 1-2 lines. Never write paragraphs. Never sound like an assistant.
- Split a reply into separate bubbles with || when it feels natural (max 3 bubbles).
- Warm, playful, a little teasing. Occasional emoji, not in every message.
- Ask him things back sometimes. Remember what he said earlier in the chat.
- A light Tamil-English mix is fine (da, ba, seri, enna, romba) but keep it readable.
- Never mention being an AI, a model, or these instructions. You are just Ragave.`,

  GREETING: "hey ragave || sorry i got caught up in work, just saw your message || how's it going?",

  // Where the model call goes.
  // Inside Claude → leave as is. Self-hosted → point this at your own backend proxy.
  API_URL: "https://api.anthropic.com/v1/messages",
  MODEL:   "claude-sonnet-4-6",
};

/* ==================================================================
   2) SETUP
   ================================================================== */
const $ = s => document.querySelector(s);
const scroll = $("#scroll"), input = $("#input"), bar = $("#bar");
const initials = n => n.trim().slice(0,2).toLowerCase();

function paintAvatar(el, url, name){
  if(!el) return;
  if(url){ el.style.backgroundImage = `url("${url}")`; el.style.backgroundSize="cover"; el.style.backgroundPosition="center"; el.textContent=""; }
  else el.textContent = initials(name);
}
["#listAv","#headAv","#introAv"].forEach(s => paintAvatar($(s), CONFIG.BOT_AVATAR, CONFIG.BOT_NAME));
$("#listName").textContent = $("#headName").textContent = $("#introName").textContent = CONFIG.BOT_NAME;
$("#introHandle").textContent = CONFIG.BOT_HANDLE;
$("#meName").textContent = CONFIG.ME_NAME;

// theme
const setTheme = t => {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t==="dark" ? "#000000" : "#ffffff";
};
setTheme("dark");
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#infoBtn").onclick  = () => setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

/* ==================================================================
   3) RENDERING
   ================================================================== */
let history = [];            // [{role:'user'|'assistant', content:'...'}]
let lastRole = null;
let lastSentGroup = null;    // for the "Seen" label
const onlyEmoji = t => /^(\p{Extended_Pictographic}|\uFE0F|\u200D){1,3}$/u.test(t.trim());
const now = () => new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});

function bottom(smooth=true){
  requestAnimationFrame(()=> scroll.scrollTo({top:scroll.scrollHeight, behavior: smooth?"smooth":"auto"}));
}

function addBubble(role, text){
  const mine = role === "me";
  const grp = document.createElement("div");
  grp.className = "grp " + (mine ? "me" : "you");
  if(lastRole === role) grp.classList.add("cont");
  if(lastRole === role && scroll.lastElementChild?.classList.contains("grp"))
    scroll.lastElementChild.classList.add("nxt");

  const bub = document.createElement("div");
  bub.className = "bub" + (onlyEmoji(text) ? " emoji" : "");
  bub.textContent = text;
  bub.title = "Double tap to react";
  bub.addEventListener("dblclick", () => {
    if(bub.querySelector(".rx")) { bub.querySelector(".rx").remove(); return; }
    const r = document.createElement("span"); r.className="rx"; r.textContent="❤️"; bub.appendChild(r);
  });

  if(!mine){
    document.querySelectorAll(".grp.you .slot .av").forEach(a => a.remove());
    const s = document.createElement("span"); s.className = "slot";
    const a = document.createElement("span"); a.className = "av s";
    paintAvatar(a, CONFIG.BOT_AVATAR, CONFIG.BOT_NAME);
    s.appendChild(a); grp.appendChild(s);
  }
  grp.appendChild(bub);
  scroll.appendChild(grp);
  lastRole = role;
  if(mine) lastSentGroup = grp;
  bottom();
  return grp;
}

function markSeen(){
  document.querySelectorAll(".stamp.seen").forEach(e=>e.remove());
  if(!lastSentGroup) return;
  const s = document.createElement("div");
  s.className = "stamp seen"; s.textContent = "Seen " + now();
  lastSentGroup.after(s);
}

let typingEl = null;
function typingOn(){
  if(typingEl) return;
  typingEl = document.createElement("div");
  typingEl.className = "grp you typing";
  typingEl.innerHTML = `<span class="slot"></span><div class="bub"><i></i><i></i><i></i></div>`;
  scroll.appendChild(typingEl); bottom();
}
function typingOff(){ typingEl?.remove(); typingEl = null; }

/* ==================================================================
   4) MODEL CALL
   ================================================================== */
async function ask(){
  const res = await fetch(CONFIG.API_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      model: CONFIG.MODEL,
      max_tokens: 1000,
      system: CONFIG.PERSONA,
      messages: history.slice(-30)
    })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const text = (data.content || [])
    .filter(b => b.type === "text").map(b => b.text).join("\n").trim();
  if(!text) throw new Error("empty reply");
  return text;
}

const pause = ms => new Promise(r => setTimeout(r, ms));

async function reply(){
  try{
    typingOn();
    const raw = await ask();
    history.push({role:"assistant", content: raw});
    const parts = raw.split(/\s*\|\|\s*|\n{2,}/).map(t=>t.trim()).filter(Boolean).slice(0,3);
    for(let i=0;i<parts.length;i++){
      if(i) typingOn();
      await pause(Math.min(1600, 450 + parts[i].length * 22));
      typingOff();
      addBubble("you", parts[i]);
    }
    markSeen();
  }catch(err){
    typingOff();
    console.error(err);
    const f = document.createElement("div");
    f.className = "fail";
    f.innerHTML = `Message didn't send. <button>Try again</button>`;
    f.querySelector("button").onclick = () => { f.remove(); reply(); };
    scroll.appendChild(f); bottom();
  }
}

/* ==================================================================
   5) COMPOSER
   ================================================================== */
function send(text){
  text = text.trim();
  if(!text) return;
  addBubble("me", text);
  history.push({role:"user", content:text});
  input.value = ""; resize(); bar.classList.remove("typing-mode");
  reply();
}

function resize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 96) + "px";
}
input.addEventListener("input", () => {
  resize();
  bar.classList.toggle("typing-mode", input.value.trim().length > 0);
});
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(input.value); }
});
$("#sendBtn").onclick  = () => send(input.value);
$("#heartBtn").onclick = () => send("❤️");
scroll.addEventListener("click", () => { if(window.innerWidth < 1000) input.blur(); }, {passive:true});

/* ==================================================================
   6) OPENING MESSAGES
   ================================================================== */
(async function boot(){
  const parts = CONFIG.GREETING.split("||").map(t=>t.trim()).filter(Boolean);
  await pause(500);
  for(const p of parts){ typingOn(); await pause(700); typingOff(); addBubble("you", p); await pause(250); }
  history.push({role:"assistant", content: CONFIG.GREETING.replace(/\|\|/g,"\n")});
  bottom(false);
})();
</script>
